name: tf-gha-install-terraform-local

on:
  workflow_call:
    inputs:
      TFAction:
        required: true
        type: string
      dply_environment:
        required: false
        type: string
      location:
        required: true
        type: string
      namespace:
        required: true
        type: string
      postfix:
        required: true
        type: string
      environment:
        required: true
        type: string
      enable_aml_computecluster:
        required: false
        type: string
        default: "false"
      enable_monitoring:
        required: false
        type: string
        default: "false"
      terraform_version:
        required: true
        type: string
      terraform_workingdir:
        required: true
        type: string
      terraform_st_location:
        required: true
        type: string
      terraform_st_storage_account:
        required: true
        type: string
      terraform_st_resource_group:
        required: true
        type: string
      terraform_st_container_name:
        required: true
        type: string
      terraform_st_key:
        required: true
        type: string
      terraform_plan_location:
        required: false
        type: string
      terraform_plan_vnet:
        required: false
        type: string
    secrets:
      ARM_CLIENT_ID:
        required: true
      ARM_CLIENT_SECRET:
        required: true
      ARM_SUBSCRIPTION_ID:
        required: true
      ARM_TENANT_ID:
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        run: |
          terraform -chdir="${{ inputs.terraform_workingdir }}" init \
            -backend-config=storage_account_name=${{ inputs.terraform_st_storage_account }} \
            -backend-config=container_name=${{ inputs.terraform_st_container_name }} \
            -backend-config=key=${{ inputs.terraform_st_key }} \
            -backend-config=resource_group_name=${{ inputs.terraform_st_resource_group }} \
            -backend-config=use_azuread_auth=true

      - name: Terraform Plan
        run: |
          terraform -chdir="${{ inputs.terraform_workingdir }}" plan \
            -out=plan.tfplan \
            -input=false \
            -var location=${{ inputs.location }} \
            -var prefix=${{ inputs.namespace }} \
            -var postfix=${{ inputs.postfix }} \
            -var environment=${{ inputs.environment }} \
            -var enable_aml_computecluster=${{ inputs.enable_aml_computecluster }} \
            -var enable_monitoring=${{ inputs.enable_monitoring }} \
            -var client_secret=${{ secrets.ARM_CLIENT_SECRET }}

      - name: Terraform Apply
        if: ${{ inputs.TFAction == 'apply' }}
        run: |
          terraform -chdir="${{ inputs.terraform_workingdir }}" apply \
            -input=false \
            plan.tfplan

